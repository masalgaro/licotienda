<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eliminar Producto - LaLico Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: "class", theme: { extend: { colors: { primary: "#36c43f", "background-dark": "#0a0a0a", "card-dark": "#1a1a1a" } } } };
    </script>
</head>
<body class="bg-background-dark text-white min-h-screen p-8 flex items-center justify-center">
    <div class="w-full max-w-sm bg-card-dark rounded-3xl p-8 border border-white/10 text-center shadow-2xl">
        <h1 class="text-2xl font-bold mb-2">Eliminar Producto</h1>
        <p class="text-slate-400 mb-6">¿Estás seguro de que deseas eliminar permanentemente "{{ product.name }}"?</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="flex gap-4">
                <a href="{% url 'admin_dashboard' %}" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl transition">
                    Cancelar
                </a>
                <button type="submit" class="flex-1 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl transition shadow-lg shadow-red-600/20">
                    Sí, Eliminar
                </button>
            </div>
        </form>
    </div>
</body>
</html>
