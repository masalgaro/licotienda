<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }} - LaLico Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <script>
        tailwind.config = { darkMode: "class", theme: { extend: { colors: { primary: "#36c43f", "background-dark": "#0a0a0a", "card-dark": "#1a1a1a" } } } };
    </script>
</head>
<body class="bg-background-dark text-white min-h-screen p-8 flex items-center justify-center">
    <div class="w-full max-w-lg bg-card-dark rounded-3xl p-8 border border-white/10 shadow-2xl">
        <div class="flex items-center gap-3 mb-6">
            <a href="{% url 'admin_dashboard' %}" class="material-icons-round text-slate-400 hover:text-white transition">arrow_back</a>
            <h1 class="text-2xl font-bold">{{ title }}</h1>
        </div>
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label class="block text-sm font-bold text-slate-400 mb-2">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <p class="text-red-400 text-xs mt-1">{{ field.errors.0 }}</p>
                {% endif %}
                {% if field.help_text %}
                <p class="text-slate-500 text-xs mt-1">{{ field.help_text }}</p>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="w-full bg-primary text-white font-bold py-4 rounded-xl mt-6 hover:bg-green-600 transition shadow-lg shadow-primary/20">
                Guardar Producto
            </button>
        </form>
    </div>
</body>
</html>
